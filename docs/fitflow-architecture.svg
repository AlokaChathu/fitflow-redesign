<text x="700" y="508" text-anchor="middle" class="small">API + Business Logic + Authorization</text>

<rect class="box" x="90" y="620" width="340" height="115"/>
<text x="260" y="654" text-anchor="middle" class="label">PostgreSQL</text>
<text x="260" y="682" text-anchor="middle" class="small">Users, Workouts, Nutrition,</text>
<text x="260" y="706" text-anchor="middle" class="small">Subscriptions &amp; Core Records</text>

