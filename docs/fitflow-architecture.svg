<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
  </marker>
  <style>
    .box { fill:#ffffff; stroke:#333333; stroke-width:2; rx:12; ry:12; }
    .title { font: bold 28px Arial, sans-serif; fill:#111; }
    .label { font: 18px Arial, sans-serif; fill:#111; }
    .small { font: 15px Arial, sans-serif; fill:#333; }
    .line { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>
</defs>

<text x="700" y="42" text-anchor="middle" class="title">FitFlow High-Level System Architecture</text>

<rect class="box" x="550" y="70" width="300" height="70"/>
<text x="700" y="112" text-anchor="middle" class="label">FitFlow Users</text>

<rect class="box" x="120" y="190" width="350" height="90"/>
<text x="295" y="225" text-anchor="middle" class="label">React Native Mobile App</text>
<text x="295" y="252" text-anchor="middle" class="small">Android / iOS</text>

<rect class="box" x="930" y="190" width="350" height="90"/>
